<!DOCTYPE html>
<html>
<head>
    <title>API Test - The Artainment</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>API Connection Test</h1>
    <p>This page tests the API connection to verify the backend is working.</p>
    
    <button onclick="testHome()">Test Home API</button>
    <button onclick="testLogin()">Test Login API</button>
    <button onclick="showConfig()">Show Configuration</button>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'https://etjkivwwnqafyphqamgh.supabase.co/functions/v1/api';
        
        function log(message, isError = false) {
            const div = document.createElement('div');
            div.className = `result ${isError ? 'error' : 'success'}`;
            div.textContent = message;
            document.getElementById('results').appendChild(div);
        }
        
        async function testHome() {
            try {
                const response = await fetch(`${API_BASE}/home`);
                const data = await response.json();
                log(`✅ Home API: ${data.films?.length || 0} films, ${data.services?.length || 0} services`);
            } catch (error) {
                log(`❌ Home API failed: ${error.message}`, true);
            }
        }
        
        async function testLogin() {
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@theartainment.co.ke',
                        password: 'Admin123!'
                    })
                });
                const data = await response.json();
                if (data.user) {
                    log(`✅ Login API: Welcome ${data.user.name} (Admin: ${data.user.is_admin})`);
                } else {
                    log(`❌ Login failed: ${data.message}`, true);
                }
            } catch (error) {
                log(`❌ Login API failed: ${error.message}`, true);
            }
        }
        
        function showConfig() {
            log(`🔧 Configuration:
            - API Base: ${API_BASE}
            - Current Domain: ${window.location.hostname}
            - User Agent: ${navigator.userAgent}`);
        }
    </script>
</body>
</html>
