<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { border-color: green; background: #f0f8f0; }
        .error { border-color: red; background: #f8f0f0; }
        .pending { border-color: orange; background: #fff8f0; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 API Debug Test</h1>
    <p><strong>Testing API endpoints from:</strong> <span id="domain"></span></p>
    
    <div id="tests"></div>

    <script>
        document.getElementById('domain').textContent = window.location.origin;
        
        const API_BASE = 'https://etjkivwwnqafyphqamgh.supabase.co/functions/v1/api';
        const tests = [
            { name: 'Home API', endpoint: '/home' },
            { name: 'Films API', endpoint: '/films' },
            { name: 'Talent API', endpoint: '/actors' },
            { name: 'News API', endpoint: '/news' },
            { name: 'Services API', endpoint: '/services' }
        ];

        function createTestElement(test) {
            const div = document.createElement('div');
            div.className = 'test pending';
            div.innerHTML = `
                <h3>${test.name}</h3>
                <p><strong>Endpoint:</strong> ${API_BASE}${test.endpoint}</p>
                <p><strong>Status:</strong> <span id="status-${test.endpoint.replace('/', '')}">Testing...</span></p>
                <pre id="result-${test.endpoint.replace('/', '')}">Loading...</pre>
            `;
            return div;
        }

        async function runTest(test) {
            const statusEl = document.getElementById(`status-${test.endpoint.replace('/', '')}`);
            const resultEl = document.getElementById(`result-${test.endpoint.replace('/', '')}`);
            const testEl = statusEl.closest('.test');

            try {
                console.log(`Testing ${test.name}: ${API_BASE}${test.endpoint}`);
                
                const response = await fetch(`${API_BASE}${test.endpoint}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    statusEl.textContent = `✅ SUCCESS (${response.status})`;
                    testEl.className = 'test success';
                    resultEl.textContent = JSON.stringify(data, null, 2);
                } else {
                    statusEl.textContent = `❌ ERROR (${response.status})`;
                    testEl.className = 'test error';
                    resultEl.textContent = JSON.stringify(data, null, 2);
                }
            } catch (error) {
                statusEl.textContent = `❌ NETWORK ERROR`;
                testEl.className = 'test error';
                resultEl.textContent = `Error: ${error.message}\n\nThis is likely a CORS issue or network problem.`;
                console.error(`${test.name} failed:`, error);
            }
        }

        // Create test elements
        const testsContainer = document.getElementById('tests');
        tests.forEach(test => {
            testsContainer.appendChild(createTestElement(test));
        });

        // Run tests sequentially
        async function runAllTests() {
            for (const test of tests) {
                await runTest(test);
                await new Promise(resolve => setTimeout(resolve, 500)); // Small delay between tests
            }
        }

        runAllTests();
    </script>
</body>
</html>
